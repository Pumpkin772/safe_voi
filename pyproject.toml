[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "direction5-safe-voi-positive-region-rebuild"
version = "0.4.0"
description = "Direction5 robust-safe capability-information positive-value region study"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary research code" }
authors = [{ name = "Direction5 frequency-control research project" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=12",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "cvxpy>=1.4",
  "control>=0.9.4",
  "casadi>=3.7,<3.8",
  "rich>=13",
  "typer>=0.9",
  "andes==2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]
notebook = ["jupyter>=1.0"]
solvers = [
  "Mosek>=10",
  "gurobipy>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"
testpaths = ["tests"]
pythonpath = ["src"]
