schema_version: d5freq.closed_loop_experiments.v3

# This protocol is frozen before any final-test episode is run.  Scenario truth
# is loaded by the simulator/evaluation process only and is never included in a
# controller constructor, reset call, measurement, or action call.
protocol_status:
  frozen: true
  frozen_before_final_test: true
  phase: 6
  revision: phase6-preregistered-v2
truth_access: simulator_and_evaluation_only

timebase:
  episode_duration_s: 180.0
  control_period_s: 0.5
  integration_step_s: 0.02

execution_policy:
  retain_failed_episodes: true
  record_run_completed_separately_from_scientific_success: true
  full_matrix_success_storage: per_episode_metrics_and_compact_audit_only
  incomplete_failure_trace_storage: bounded_strict_json
  failure_trace_point_limit: 2001
  failure_trace_interval_limit: 401
  selected_trajectory_export_policy: deterministic_post_final_replay
  selected_trajectory_format: parquet_zstd
  tuning_and_final_worker_processes: 4
  solver_threads_per_episode: 1
  final_test_is_read_only_after_first_run: true
  controller_receives_truth: false

seed_sets:
  smoke:
    start: 0
    stop_inclusive: 1
    count: 2
  tuning:
    start: 100
    stop_inclusive: 109
    count: 10
  final_known:
    start: 1000
    stop_inclusive: 1029
    count: 30
  final_ood_extreme:
    start: 1000
    stop_inclusive: 1049
    count: 50

data_splits:
  split_unit: trajectory
  identification_train: local_arx_gmm_and_mode_library_fit
  identification_validation: arx_order_ridge_and_fixed_reference_selection
  ood_calibration: known_modes_only_threshold_calibration
  closed_loop_validation: tuning_seed_set_only
  closed_loop_test: final_known_seed_set_only
  ood_test: final_ood_extreme_seed_set_only

# One global candidate is selected on closed-loop validation and locked before
# any final seed is evaluated.  The ordered criteria and final hash tie-breaker
# make the selection deterministic and prevent scenario-specific cherry-picks.
tuning_selection:
  split: closed_loop_validation
  seed_set: tuning
  one_global_configuration_for_all_final_scenarios: true
  final_test_feedback_forbidden: true
  ordered_objectives:
    - minimize_catastrophic_failure_rate
    - minimize_mean_frequency_iae_hz_s
    - minimize_q95_max_abs_frequency_deviation_hz
    - minimize_mean_solver_wall_time_s
  deterministic_tie_breaker: lexicographically_smallest_resolved_config_sha256
  selection_record_required: true
  selection_record_must_precede_final_ledger: true

# Method IDs are the stable statistical pairing keys.  B4 is an explicitly
# isolated evaluation upper bound; no other method may consume simulator truth.
methods:
  - method_id: B0
    output_slug: lqi_only
    role: baseline
    truth_access: none
    definition: LQI-only with IBR command withdrawal
  - method_id: B1
    output_slug: fixed_reference_arx_mpc
    role: baseline
    truth_access: none
    definition: fixed discovered ARX component selected on identification validation only
  - method_id: B2
    output_slug: single_model_rls_mpc
    role: baseline
    truth_access: none
    definition: one online recursive-least-squares ARX model
  - method_id: B3
    output_slug: hard_map_mode_mpc
    role: baseline
    truth_access: none
    definition: hard MAP component from the runtime belief
  - method_id: B4
    output_slug: oracle_arx_mpc
    role: evaluation_upper_bound
    truth_access: evaluation_oracle_only
    definition: truth-informed known-mode ARX selection isolated under evaluation
  - method_id: P
    output_slug: sd_bmpc
    role: proposed
    truth_access: none
    definition: full self-diagnosing belief-space MPC
  - method_id: no-worst
    output_slug: sd_bmpc_no_worst_case
    role: ablation
    truth_access: none
    definition: SD-BMPC with entropy-weighted worst-mode term disabled
  - method_id: no-OOD
    output_slug: sd_bmpc_no_ood_fallback
    role: ablation
    truth_access: none
    definition: SD-BMPC with OOD-triggered fallback disabled
  - method_id: no-tightening
    output_slug: sd_bmpc_no_uncertainty_tightening
    role: ablation
    truth_access: none
    definition: SD-BMPC with uncertainty tightening disabled
  - method_id: fixed-K4-unlabeled
    output_slug: sd_bmpc_fixed_k4_unlabeled_library
    role: ablation
    truth_access: none
    definition: train-only unlabeled mode discovery forced to K=4
  - method_id: labeled-library
    output_slug: sd_bmpc_labeled_training_library
    role: ablation
    truth_access: training_labels_only
    definition: train-only true labels used to fit the offline known-mode library
  - method_id: no-transition-prior
    output_slug: sd_bmpc_no_transition_prior
    role: ablation
    truth_access: none
    definition: SD-BMPC belief update without the sticky Markov transition prior

noise_profiles:
  # Standard closed-loop profiles use the same 2e-4 pu power-measurement
  # standard deviation used by the frozen belief/OOD calibration.  The high
  # profile is an explicit 5x-std robustness stress and is reported separately.
  low:
    omega_std_pu: 1.0e-5
    power_std_pu: 2.0e-4
  medium:
    omega_std_pu: 3.0e-5
    power_std_pu: 2.0e-4
  high:
    omega_std_pu: 1.0e-4
    power_std_pu: 1.0e-3

# Every row below is one concrete pairing key.  A family name alone is never a
# runnable scenario, so variants cannot be silently pooled or confused.
scenario_variants:
  - scenario_id: S0_nominal_stochastic
    family: S0
    variant: nominal_stochastic
    description: nominal mode with a small reproducible stochastic load
    truth_class: known
    noise_profile: low
    final_seed_set: final_known
    load:
      events: []
      stochastic:
        enabled: true
        sample_period_s: 0.5
        white_std_pu: 1.0e-3
        random_walk_step_std_pu: 7.071067811865475e-5
    mode:
      initial: nominal
      switches: []

  - scenario_id: S1_step_pos_002
    family: S1
    variant: step_pos_002
    description: positive 0.02 pu load step at 60 s without a mode switch
    truth_class: known
    noise_profile: low
    final_seed_set: final_known
    load:
      events: [{start_time_s: 60.0, magnitude_pu: 0.02, end_time_s: null}]
      stochastic: {enabled: false, sample_period_s: 0.5, white_std_pu: 0.0, random_walk_step_std_pu: 0.0}
    mode: {initial: nominal, switches: []}
  - scenario_id: S1_step_neg_002
    family: S1
    variant: step_neg_002
    description: negative 0.02 pu load step at 60 s without a mode switch
    truth_class: known
    noise_profile: low
    final_seed_set: final_known
    load:
      events: [{start_time_s: 60.0, magnitude_pu: -0.02, end_time_s: null}]
      stochastic: {enabled: false, sample_period_s: 0.5, white_std_pu: 0.0, random_walk_step_std_pu: 0.0}
    mode: {initial: nominal, switches: []}
  - scenario_id: S1_step_pos_004
    family: S1
    variant: step_pos_004
    description: positive 0.04 pu load step at 60 s without a mode switch
    truth_class: known
