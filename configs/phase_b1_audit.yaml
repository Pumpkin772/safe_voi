schema_version: d5freq.phase_b1.audit_protocol.v1
protocol_status: preregistered_before_final
base_scenario_protocol: configs/experiments.yaml
episode_duration_s: 180.0
control_period_s: 0.5
integration_step_s: 0.02
retain_failed_episodes: true
missing_metric_policy: never_fill_with_zero

seed_sets:
  smoke: {start: 300, stop_inclusive: 301, count: 2}
  validation: {start: 400, stop_inclusive: 409, count: 10}
  final_known: {start: 3000, stop_inclusive: 3029, count: 30}
  final_ood_extreme: {start: 3000, stop_inclusive: 3049, count: 50}

final_feedback_policy:
  tune_on_final: false
  run_final_once_after_protocol_lock: true
  delete_or_filter_failed_episode: false

representative_trajectories:
  selection_status: preregistered_before_final
  seed: 3000
  sg_level: B
  scenario_ids: [S1_step_pos_006, S4_unavailable_coincident, S7_ood_asymmetric_limit]
  method_ids: [B0, B5, P_old, C4_gradual_authority]
  persist_high_frequency_truth: false

scenario_scope:
  materiality_and_b5:
    source: all_21_frozen_phase6_scenarios
  model_adequacy:
    scenario_ids:
      - S0_nominal_stochastic
      - S1_step_pos_002
      - S1_step_neg_002
      - S1_step_pos_006
      - S1_step_neg_006
      - S1_step_pos_008
      - S2_sluggish_switch_050
      - S2_sluggish_switch_060
      - S3_derated_coincident
      - S4_unavailable_coincident
      - S5_multi_switch_stochastic
      - S6_sluggish_coincident_high_noise
      - S7_ood_asymmetric_limit
      - S8_ood_time_varying_delay
      - S9_compound_unavailable_double_step
  control_design:
    scenario_ids:
      - S0_nominal_stochastic
      - S1_step_pos_006
      - S2_sluggish_switch_050
      - S2_sluggish_switch_060
      - S3_derated_coincident
      - S4_unavailable_coincident
      - S5_multi_switch_stochastic
      - S6_sluggish_coincident_high_noise
      - S7_ood_asymmetric_limit
      - S8_ood_time_varying_delay
      - S9_compound_unavailable_double_step

methods:
  core: [B0, B2, B4, B5, P_old]
  counterfactuals:
    - C0_true_arx_expected
    - C1_true_arx_worst
    - C2_perfect_belief_current_mpc
    - C3_current_belief_expected
    - C4_gradual_authority
    - C5_no_sticky_prior

counterfactual_contract:
  shared_weights: configs/mpc.yaml
  shared_horizon_steps: 20
  shared_bounds: configs/phase_b1_sg_levels.yaml
  shared_solver_priority: [MOSEK, GUROBI]
  one_factor_change_only: true
  gradual_authority:
    known_ratio: 1.0
    suspect_min_ratio: 0.50
    ood_active_min_ratio: 0.20
    recovery_min_ratio: 0.50
    continuous_driver: normalized_belief_entropy
  factor_ladder:
    C0_true_arx_expected:
      belief: perfect_evaluation_only_labeled_k4
      worst_mode_cost: false
      constraint_tightening: false
      ood_authority: not_applicable_perfect_belief
    C1_true_arx_worst:
      differs_from: C0_true_arx_expected
      sole_change: worst_mode_cost_false_to_true
    C2_perfect_belief_current_mpc:
      differs_from: C1_true_arx_worst
      sole_change: constraint_tightening_false_to_true
    C3_current_belief_expected:
      differs_from: P_old
      sole_change: worst_mode_cost_true_to_false
    C4_gradual_authority:
      differs_from: P_old
      sole_change: binary_ood_fallback_to_continuous_ibr_authority
    C5_no_sticky_prior:
      differs_from: P_old
      sole_change: sticky_transition_prior_to_uniform_transition_prior

identifiability:
  windows_s: [2.0, 5.0, 10.0, 20.0]
  belief_threshold: 0.80
  hold_steps: 3
  frequency_critical_windows_s: [5.0, 10.0]
  gramian_eigenvalue_threshold: 1.0e-8
  gramian_condition_threshold: 1.0e10
  log_likelihood_margin_threshold: 2.0

statistics:
  pairing_keys: [scenario_id, seed, sg_level]
  confidence_level: 0.95
  bootstrap_resamples: 10000
  bootstrap_seed: 20260729
  paired_tests: [sign_flip, wilcoxon]
  multiple_comparison_correction: holm
  strata: [overall, scenario_id, sg_level, truth_class]

materiality_gate:
  frequency_iae_improvement_min_fraction: 0.10
  max_frequency_worsening_max_fraction: 0.02
  sg_mileage_improvement_min_fraction: 0.20
  frequency_iae_worsening_max_fraction: 0.02
  physical_feasibility_min_success_rate: 0.95
  require_at_least_one_gate_in_any_physically_feasible_level: true

decision_operationalization:
  model_mismatch:
    b4_vs_b5_frequency_iae_gap_min_fraction: 0.10
  identifiability:
    critical_window_s: 5.0
    delayed_or_censored_switch_fraction_min: 0.50
    b4_vs_b5_close_gap_max_fraction: 0.10
  control_design:
    isolated_counterfactual_frequency_iae_gain_min_fraction: 0.10
    bayes_delayed_or_censored_switch_fraction_max: 0.50
  combined:
    report_all_triggered_bottlenecks: true
    secondary_evidence_min_normalized_score: 0.75
    primary_order_tie_break: [MODEL_MISMATCH, IDENTIFIABILITY, CONTROL_DESIGN]

decision_labels:
  - PROBLEM_NOT_MATERIAL
  - MODEL_MISMATCH_DOMINANT
  - IDENTIFIABILITY_DOMINANT
  - CONTROL_DESIGN_DOMINANT
  - COMBINED
