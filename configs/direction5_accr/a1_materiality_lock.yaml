project: DIRECTION5
stage: A1
method: ACCR-MPC
registered_before_execution: true
depends_on_a0_status: PASS
split: development
seed_range_used: [206, 229]
final_seeds_consumed: false
plants: [A_full_nonlinear]
mechanisms: [power_drop, ramp_drop]
sg_tensions: [low, high]
periods_s: [2.0, 4.0]
replicates_per_design_cell: 3
duration_s: 300.0
nominal_warmup_min_s: 60.0
capability_change_time_range_s: [100.0, 130.0]
load_event_offsets_s: [-14.0, 0.0, 14.0]
initial_soc: 0.50
physical_dt_s: 0.05
horizon_steps: 3
load_fraction_of_sg_upper: 0.62
load_cross_area_fraction: 0.25
capability_after_change:
  power_drop:
    lower_power_pu: [-0.065, -0.065]
    upper_power_pu: [0.065, 0.065]
    ramp_down_pu_per_s: [0.025, 0.025]
    ramp_up_pu_per_s: [0.025, 0.025]
    delay_s: [1.50, 1.50]
  ramp_drop:
    lower_power_pu: [-0.045, -0.045]
    upper_power_pu: [0.045, 0.045]
    ramp_down_pu_per_s: [0.055, 0.055]
    ramp_up_pu_per_s: [0.055, 0.055]
    delay_s: [1.50, 1.50]
methods: [contract_only_rolling_mpc, perfect_capability_oracle_mpc]
primary_metrics: [ace_iae_pu_s, tie_iae_pu_s, sg_mechanical_mileage_pu]
statistics:
  paired_absolute_difference: contract_minus_perfect
  bootstrap: seed_design_cell_hierarchical
  bootstrap_resamples: 5000
  confidence_level: 0.95
gate:
  minimum_formal_sources: 70
  minimum_positive_cells: 2
  same_mechanism_must_be_positive_in_both_tensions: true
  positive_metric_requires_ci_lower_gt: 0.0
  frequency_peak_hz_max: 1.0
  hard_violations_max: 0
resource_guard:
  max_system_commit_fraction: 0.65
  # CVXPY/CLARABEL produces a short-lived ~5 GiB system-commit excursion that
  # is not reflected in resident task-tree memory.  The absolute 65% commit,
  # 8 GiB available-RAM, 4 GiB task-private and one-descendant hard limits stay
  # unchanged; this relative check remains an earlier 6 GiB tripwire.
  max_system_commit_growth_gib: 6.0
  min_available_physical_gib: 8.0
  max_process_tree_private_gib: 4.0
  max_descendant_processes: 1
  poll_interval_s: 0.10
  timeout_s: 7200.0
