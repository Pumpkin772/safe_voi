# User decision (2026-07-22): reuse and synchronize the existing topo_sfr
# environment instead of creating the originally proposed environment name.
name: topo_sfr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - pyarrow
  - matplotlib
  - scikit-learn
  - pyyaml
  - cvxpy
  - pytest
  - pytest-cov
  - jupyter
  - pip
  - pip:
      - control
      - rich
      - typer
      - Mosek
      - gurobipy
