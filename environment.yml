# User decision (2026-07-22): reuse and synchronize the existing topo_sfr
# environment instead of creating the originally proposed environment name.
name: topo_sfr
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Keep NumPy/SciPy on one BLAS/OpenMP runtime on Windows.  The unconstrained
  # solver can otherwise combine MKL's libiomp with scikit-learn's libomp.
  - "libblas=*=*openblas"
  - "libcblas=*=*openblas"
  - "liblapack=*=*openblas"
  - numpy
  - scipy
  - pandas
  - pyarrow
  - matplotlib
  - scikit-learn
  - pyyaml
  - cvxpy
  - casadi=3.7.2
  - ipopt=3.14.19
  - pytest
  - pytest-cov
  - jupyter
  - pip
  - pip:
      - control
      - rich
      - typer
      - Mosek
      - gurobipy
